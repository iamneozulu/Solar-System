<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar System</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="loadingScreen">
    <div id="stars"></div>
    <div class="loader">
      <div class="loader-ring"></div>
      <div class="loader-ring"></div>
      <div class="loader-ring"></div>
      <div class="loader-core"></div>
    </div>
    <h1>THE SOLAR SYSTEM</h1>
    <p class="subtitle">An interactive 3D exploration</p>
    <div id="progressContainer">
      <div id="progressBar"></div>
    </div>
    <span id="progressText">Loading...</span>
  </div>

  <button id="pauseButton" title="Pause">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="play"></span>
  </button>

  <div id="viewControls">
    <button id="compareButton" title="Compare sizes side by side">
      <span class="compare-icon"><span class="compare-bar"></span><span class="compare-bar"></span><span class="compare-bar"></span><span class="compare-bar"></span></span>
      <span class="compare-label">Compare</span>
    </button>
    <button id="toScaleButton" title="Toggle to scale mode">
      <span class="to-scale-dot"></span>
      <span class="to-scale-label">To Scale</span>
    </button>
    <button id="orbitToggle" title="Toggle orbit lines">
      <span class="orbit-icon"></span>
      <span class="orbit-label">Orbits</span>
    </button>
  </div>

  <div id="compareView" class="hidden">
    <button id="compareBackButton" title="Back to solar system">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 5 12 11 7"></polyline></svg>
    </button>
    <button id="compareToggle" title="Show planet list">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
    </button>
    <div id="compareSidebar">
      <div class="compare-sidebar-header">
        <h3>Size Comparison</h3>
        <div class="compare-sidebar-actions">
          <button type="button" id="compareAllButton">All</button>
          <button type="button" id="compareNoneButton">None</button>
        </div>
        <p class="compare-sidebar-sub">Tap objects to toggle them in the row below.</p>
      </div>
      <div id="compareList"></div>
    </div>
    <div id="compareHint">Drag to rotate &middot; Scroll to zoom</div>
  </div>

  <div id="detailView" class="hidden">
    <button id="backButton" title="Back to solar system">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <button id="infoToggle" title="Toggle info panel (I)">
      <span></span><span></span><span></span>
    </button>
    <div id="detailPanel" class="detail-info">
      <div class="detail-header">
        <div id="detailColorDot"></div>
        <h2 id="detailTitle">Object Information</h2>
      </div>
      <p id="detailDescription">Details about the selected object will appear here.</p>
      <div id="detailDetails"></div>
      <div id="detailFunFact"></div>
    </div>
    <div id="detailHint">Drag to rotate &middot; Scroll to zoom <span id="detailHintEscape">Press Esc to exit</span></div>
  </div>

  <div id="tooltip"></div>

  <div id="detailFade"></div>

  <script type="module" src="./src/main.js"></script>
  <noscript>Your browser does not support JavaScript.</noscript>
</body>
</html>
